# Render blueprint — HELIX TEE Compiler service.
# The frontend (Vercel) POSTs /compile and /preview here; CORS is already open (*).
# Node strips TS types at runtime, so there is no build step beyond a no-op install.
services:
  - type: web
    name: helix-compiler
    runtime: node
    plan: free
    rootDir: tee
    region: oregon
    buildCommand: "npm install || true"
    startCommand: "node src/compiler/server.ts"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24.14.0"
      - key: OFFLINE
        value: "0"
      - key: HELIX_PACKAGE_ID
        value: "0xdc4b27696494c3c5f54513b19781686f7354a7b09f7ccf2285f7b843c7add2b3"
      - key: TATUM_SUI_TESTNET
        value: https://sui-testnet.gateway.tatum.io
      - key: TATUM_SUI_MAINNET
        value: https://sui-mainnet.gateway.tatum.io
      - key: MEMWAL_RELAYER_URL
        value: https://relayer.memory.walrus.xyz
      - key: MEMWAL_NAMESPACE_PREFIX
        value: helix-v1
      - key: FEATURE_CROWD
        value: "1"
      - key: FEATURE_WITNESS
        value: "1"
      - key: DEMO_ADDRESS
        value: "0x16a384bb220c70d4590425b14563118b7a05b5fa00dfe55757dba315663c8884"
      - key: KEEPALIVE_URL
        value: https://helix-compiler.onrender.com/healthz
      - key: HELIX_JOURNAL_PACKAGE
        value: "0x5bcf3bf66f6c71f53aaf681842b554edde5b6c141c7315ba0ac6b4cd6766652f"
      # secrets — set in the Render dashboard / API, never committed
      - key: TATUM_API_KEY
        sync: false
      - key: MEMWAL_ACCOUNT_ID
        sync: false
      - key: MEMWAL_PRIVATE_KEY
        sync: false
      - key: MEMWAL_AGENT_ID
        sync: false
      # gas sponsor for helix::journal::commit only (dedicated low-value testnet key)
      - key: SPONSOR_SUI_KEY
        sync: false
      # the Council: four rule-based agents, each with its own key and gas (never the judge sponsor)
      - key: FEATURE_COUNCIL
        value: "1"
      # on-chain soulbound Forecaster Passport (helix_passport, see DEPLOYMENT.md)
      - key: FEATURE_ONCHAIN_PASSPORT
        value: "1"
      - key: COUNCIL_KEY_MOMENTUM
        sync: false
      - key: COUNCIL_KEY_REVERSION
        sync: false
      - key: COUNCIL_KEY_SURFACE
        sync: false
      - key: COUNCIL_KEY_CROWD
        sync: false
      # Passport attestation signer (public key at /.well-known/helix-attestation.json)
      - key: HELIX_ATTESTATION_KEY
        sync: false
